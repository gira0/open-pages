name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Runs gofmt, goimports, go vet, staticcheck, gosec and more; see .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch release, so govulncheck reflects a patched standard library.
          go-version: stable
      - run: go build ./...
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          {
            echo "### Test coverage: ${total}%"
            echo '<details><summary>Per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total=$total" >> "$GITHUB_OUTPUT"
        id: coverage
      - name: Render HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
      # Runs last so the summary and report above are available when it fails.
      - name: Enforce coverage minimum
        run: |
          awk -v t="$TOTAL" -v min="$COVERAGE_MIN" 'BEGIN { if (t + 0 < min) { printf "Coverage %s%% is below the %s%% minimum\n", t, min; exit 1 } }'
        env:
          TOTAL: ${{ steps.coverage.outputs.total }}
          COVERAGE_MIN: 70

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rules are in redocly.yaml; the route-to-spec check is TestOpenAPIMatchesRoutes.
      - run: npx --yes @redocly/cli@2.57.0 lint api/openapi.yaml

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: open-pages:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # On a pull request the merge commit's first parent is the base, so this lists the PR's files.
      - name: Decide whether the Trivy scan blocks
        id: trivy
        run: |
          block=1
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             ! git diff --name-only HEAD^1 HEAD | grep -Eq '^(Dockerfile|go\.(mod|sum)|\.github/workflows/)'; then
            block=0
          fi
          echo "exit_code=$block" >> "$GITHUB_OUTPUT"
      - name: Build the image (not pushed)
        run: docker build --tag "$IMAGE" --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" .
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: open-pages:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Blocking on main and tags, and on pull requests that change the Dockerfile, the Go
          # module files or the workflows. Other pull requests only print the findings, so a new
          # upstream CVE cannot turn PRs that never touched the image red.
          exit-code: ${{ steps.trivy.outputs.exit_code }}
      # Two runs on fresh named volumes, both with a read-only root, all capabilities dropped
      # and only /data and a tmpfs /tmp writable; the defaults baked into the image supply
      # app_host/content_domain. First as the image's own user (65532:0), the Docker/compose
      # path, then as an arbitrary UID with GID 0, what OpenShift's restricted-v2 SCC
      # assigns, which needs the image's /data to be group-writable.
      - name: Smoke test with a read-only root, as the image user and as an arbitrary UID
        run: |
          smoke() {
            name=$1 port=$2; shift 2
            docker run -d --name "$name" --read-only --cap-drop ALL \
              --security-opt no-new-privileges --tmpfs /tmp -p "$port:8080" "$@" "$IMAGE"
            code=000
            for _ in $(seq 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/readyz" || true)
              [ "$code" = 200 ] && break
              sleep 1
            done
            docker logs "$name"
            if [ "$code" != 200 ]; then
              echo "::error::$name: /readyz returned $code"
              exit 1
            fi
          }
          docker volume create smoke-default
          smoke smoke-default 18080 -v smoke-default:/data
          docker volume create smoke-arbitrary
          smoke smoke-arbitrary 18081 --user 1000780000:0 -v smoke-arbitrary:/data

  # Workflow and script lint. CodeQL's actions analysis does not catch syntax or expression
  # errors. actionlint runs shellcheck on inline run: blocks when shellcheck is on PATH.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh

  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < Dockerfile

  # Misconfiguration scan of the Dockerfile, the compose file and the rendered Helm chart.
  config-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Render the chart with each CI values file
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.19.4
          mkdir -p "$RUNNER_TEMP/scan/chart"
          for f in deploy/helm/open-pages/ci/*.yaml; do
            "$RUNNER_TEMP/bin/helm" template ci deploy/helm/open-pages --kube-version 1.31.0 -f "$f" \
              > "$RUNNER_TEMP/scan/chart/$(basename "$f")"
          done
          cp Dockerfile "$RUNNER_TEMP/scan/"
          cp deploy/docker-compose.yml "$RUNNER_TEMP/scan/"
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/scan
          severity: HIGH,CRITICAL
          exit-code: 1

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/open-pages
      # Rendering offline has no cluster to ask, so state the Kubernetes version to render for.
      KUBE_VERSION: 1.31.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Both tools are built from pinned module versions; the Go module proxy and checksum
      # database verify the source, so there is no tarball to hash by hand.
      - name: Install Helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.19.4
          GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint the chart with each CI values file
        run: |
          for f in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint $f"
            helm lint --strict "$CHART" -f "$f"
            echo "::endgroup::"
          done
      # Route, ServiceMonitor and HTTPRoute are CRDs: their schemas come from the datree
      # catalog, and a kind without a schema anywhere is skipped rather than failed.
      - name: Render and validate the manifests
        run: |
          for f in "$CHART"/ci/*.yaml; do
            echo "::group::$f"
            helm template ci "$CHART" --kube-version "$KUBE_VERSION" -f "$f" > rendered.yaml
            kubeconform -strict -summary -ignore-missing-schemas \
              -kubernetes-version "$KUBE_VERSION" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              rendered.yaml
            echo "::endgroup::"
          done
      # The ConfigMap's ini keys are written by hand, and kubeconform only checks Kubernetes
      # schemas. Load the rendered settings.ini with the app's own config loader.
      - name: Check that the generated settings.ini loads in the app
        run: |
          for f in "$CHART"/ci/*.yaml; do
            echo "::group::$f"
            helm template ci "$CHART" --kube-version "$KUBE_VERSION" -f "$f" \
              --show-only templates/configmap.yaml > configmap.yaml
            helm template ci "$CHART" --kube-version "$KUBE_VERSION" -f "$f" \
              --show-only templates/deployment.yaml > deployment.yaml
            # settings.ini from the ConfigMap, and the OPEN_PAGES_*_FILE variables from the
            # Deployment, each pointed at a dummy file, so the test sees the pod's environment.
            python3 - configmap.yaml deployment.yaml settings.ini chart.env <<'PY'
          import os, sys, tempfile, yaml
          cm, dep, ini, envfile = sys.argv[1:]
          open(ini, "w").write(yaml.safe_load(open(cm))["data"]["settings.ini"])
          env = yaml.safe_load(open(dep))["spec"]["template"]["spec"]["containers"][0].get("env", [])
          d = tempfile.mkdtemp()
          with open(envfile, "w") as out:
              for e in env:
                  if e["name"].startswith("OPEN_PAGES_") and e["name"].endswith("_FILE"):
                      p = os.path.join(d, os.path.basename(e["value"]))
                      open(p, "w").write("ci-dummy-value-0123456789\n")
                      out.write(f"{e['name']}={p}\n")
          PY
            OPEN_PAGES_CHART_SETTINGS="$PWD/settings.ini" OPEN_PAGES_CHART_ENV="$PWD/chart.env" \
              go test -count=1 -run TestChartSettings ./internal/config
            echo "::endgroup::"
          done
      # The release workflow packages the chart with the release version for both fields.
      - name: Package the chart as the release does
        run: |
          helm package "$CHART" --version 0.0.0-ci --app-version 0.0.0-ci --destination "$RUNNER_TEMP/pkg"
          helm lint --strict "$RUNNER_TEMP/pkg/open-pages-0.0.0-ci.tgz" -f "$CHART/ci/default-values.yaml"
          helm template ci "$RUNNER_TEMP/pkg/open-pages-0.0.0-ci.tgz" --kube-version "$KUBE_VERSION" \
            -f "$CHART/ci/default-values.yaml" | grep -q 'ghcr.io/gira0/open-pages:0.0.0-ci'
      - name: Check that unsupported settings are refused
        run: |
          set -u
          base=(--kube-version "$KUBE_VERSION" -f "$CHART/ci/default-values.yaml")
          if helm template ci "$CHART" "${base[@]}" --set replicaCount=2; then
            echo "::error::replicaCount=2 should be rejected"; exit 1
          fi
          if helm template ci "$CHART" --kube-version "$KUBE_VERSION" 2>err.txt; then
            echo "::error::rendering without config.appHost should fail"; exit 1
          fi
          grep -q 'config.appHost is required' err.txt
          if helm template ci "$CHART" "${base[@]}" --set config.storage.type=s3; then
            echo "::error::storage.type=s3 without a bucket should be rejected"; exit 1
          fi
          if helm template ci "$CHART" "${base[@]}" --set config.storage.s3.bucket=b; then
            echo "::error::an s3 bucket with storage.type=local should be rejected"; exit 1
          fi
          if helm template ci "$CHART" "${base[@]}" --set config.storage.type=s3 \
            --set config.storage.s3.bucket=b --set config.storage.s3.credentialsFromSecret=true; then
            echo "::error::credentialsFromSecret without keys should be rejected"; exit 1
          fi

  # Installs the chart on a kind cluster that enforces the Pod Security "restricted" level,
  # runs the pod as an arbitrary UID in group 0 (what OpenShift's restricted-v2 does), deploys
  # a site through the API, fetches it on its wildcard host and restarts the pod. See
  # scripts/e2e-kind.sh.
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install Helm and kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.19.4
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.30.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the image
        run: docker build -t docker.io/library/open-pages:e2e .
      - name: Create the cluster and load the image
        run: |
          kind create cluster --wait 120s
          kind load docker-image docker.io/library/open-pages:e2e
      - name: Run the end-to-end test
        run: scripts/e2e-kind.sh

  # Runs the storage conformance suite against a real S3-compatible server. Garage is an
  # AGPL-3.0 licensed, actively maintained project from Deuxfleurs (France). MinIO's community
  # edition is archived. The suite also runs against an in-process fake in the test job; this
  # job checks the real wire behaviour.
  s3-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GARAGE_IMAGE: dxflrs/garage:v2.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Start Garage
        run: |
          # A single node, no replication, path-style S3 on :3900. The secrets are random
          # per run, so nothing credential-shaped is committed.
          cat > "$RUNNER_TEMP/garage.toml" <<EOF
          metadata_dir = "/data/meta"
          data_dir = "/data/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "127.0.0.1:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"

          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "0.0.0.0:3900"
          EOF
          docker run -d --name garage --network host \
            -v "$RUNNER_TEMP/garage.toml:/etc/garage.toml:ro" \
            "$GARAGE_IMAGE"
          garage() { docker exec garage /garage "$@"; }
          for _ in $(seq 1 60); do
            if garage status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node_id="$(garage node id -q | cut -d@ -f1)"
          garage layout assign -z dc1 -c 1G "$node_id"
          garage layout apply --version 1
          garage bucket create open-pages-ci
          garage key create open-pages-ci-key > "$RUNNER_TEMP/key.txt"
          access_key="$(awk '/^Key ID:/ {print $3}' "$RUNNER_TEMP/key.txt")"
          secret_key="$(awk '/^Secret key:/ {print $3}' "$RUNNER_TEMP/key.txt")"
          echo "::add-mask::$secret_key"
          garage bucket allow --read --write --owner open-pages-ci --key open-pages-ci-key
          echo "OPEN_PAGES_TEST_S3_ACCESS_KEY=$access_key" >> "$GITHUB_ENV"
          echo "OPEN_PAGES_TEST_S3_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
          # Wait until the S3 port answers (any HTTP status, even 403, means it is up).
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3900/ || true)"
            if [ "$code" != 000 ]; then exit 0; fi
            sleep 1
          done
          docker logs garage
          echo "Garage S3 API never answered" >&2
          exit 1
      - name: Run the conformance suite
        env:
          OPEN_PAGES_TEST_S3_ENDPOINT: http://127.0.0.1:3900
          OPEN_PAGES_TEST_S3_BUCKET: open-pages-ci
        run: go test -count=1 -v -run TestS3 ./internal/storage
      - name: Show the Garage log on failure
        if: failure()
        run: docker logs garage
