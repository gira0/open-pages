name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Runs gofmt, goimports, go vet, staticcheck, gosec and more; see .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch release, so govulncheck reflects a patched standard library.
          go-version: stable
      - run: go build ./...
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          {
            echo "### Test coverage: ${total}%"
            echo '<details><summary>Per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total=$total" >> "$GITHUB_OUTPUT"
        id: coverage
      - name: Render HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
      # Runs last so the summary and report above are available when it fails.
      - name: Enforce coverage minimum
        run: |
          awk -v t="$TOTAL" -v min="$COVERAGE_MIN" 'BEGIN { if (t + 0 < min) { printf "Coverage %s%% is below the %s%% minimum\n", t, min; exit 1 } }'
        env:
          TOTAL: ${{ steps.coverage.outputs.total }}
          COVERAGE_MIN: 70

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rules are in redocly.yaml; the route-to-spec check is TestOpenAPIMatchesRoutes.
      - run: npx --yes @redocly/cli@2.57.0 lint api/openapi.yaml

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: open-pages:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build --tag "$IMAGE" --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" .
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: open-pages:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Two runs on fresh named volumes, both with a read-only root, all capabilities dropped
      # and only /data and a tmpfs /tmp writable; the defaults baked into the image supply
      # app_host/content_domain. First as the image's own user (65532:0), the Docker/compose
      # path, then as an arbitrary UID with GID 0, what OpenShift's restricted-v2 SCC
      # assigns, which needs the image's /data to be group-writable.
      - name: Smoke test with a read-only root, as the image user and as an arbitrary UID
        run: |
          smoke() {
            name=$1 port=$2; shift 2
            docker run -d --name "$name" --read-only --cap-drop ALL \
              --security-opt no-new-privileges --tmpfs /tmp -p "$port:8080" "$@" "$IMAGE"
            code=000
            for _ in $(seq 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/readyz" || true)
              [ "$code" = 200 ] && break
              sleep 1
            done
            docker logs "$name"
            if [ "$code" != 200 ]; then
              echo "::error::$name: /readyz returned $code"
              exit 1
            fi
          }
          docker volume create smoke-default
          smoke smoke-default 18080 -v smoke-default:/data
          docker volume create smoke-arbitrary
          smoke smoke-arbitrary 18081 --user 1000780000:0 -v smoke-arbitrary:/data
