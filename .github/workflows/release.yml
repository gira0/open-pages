name: Release

# Pushing a tag like v1.2.3 (or v1.2.3-rc.1 for a prerelease) publishes a GitHub
# release with linux/amd64 and linux/arm64 archives and a multi-arch container image
# on ghcr.io, signed with cosign (keyless) and published with an SBOM and provenance, and the
# Helm chart as an OCI artifact at ghcr.io/<owner>/charts/open-pages, signed the same way.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archives
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name="open-pages_${TAG}_linux_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "build/$name/open-pages" ./cmd/open-pages
            # The UI templates and assets are embedded in the binary; ship the sample settings
            # the license, and the notices of the embedded third-party fonts and CSS alongside.
            cp configs/settings.ini LICENSE NOTICE "build/$name/"
            mkdir "build/$name/licenses"
            cp web/static/patternfly/*.txt "build/$name/licenses/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Publish the release
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          # A tag with a hyphen (v1.2.3-rc.1) is a prerelease.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}"

  image:
    # Publish the image only once the release (tests, archives) has succeeded.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signature
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            # Stable releases also move the major.minor and latest tags.
            if [[ "$version" != *-* ]]; then
              echo "$image:${version%.*}"
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Dockerfile cross-compiles on the runner's own architecture, so building
      # for arm64 needs no QEMU emulation. The SBOM and the max-mode SLSA provenance are
      # stored in the registry as attestations next to the image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: signs with this job's OIDC identity (id-token: write), recorded in the
      # Rekor transparency log. Signing the digest covers every tag that points at it.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    # The chart's default image tag is its appVersion, so publish it only after the image.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart to ghcr.io
      id-token: write # keyless cosign signature
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag is a version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Built from a pinned module version, as in ci.yml.
      - name: Install Helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.19.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The chart version and appVersion both become the release version, so the default
      # image tag (appVersion) is the image published by the job above.
      - name: Package and push the chart
        id: push
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package deploy/helm/open-pages --version "$version" --app-version "$version" --destination dist
          helm push "dist/open-pages-$version.tgz" "oci://ghcr.io/$owner/charts" 2>&1 | tee push.txt
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' push.txt | tail -n 1)"
          if [ -z "$digest" ]; then
            echo "::error::could not read the chart digest from helm push"
            exit 1
          fi
          echo "ref=ghcr.io/$owner/charts/open-pages" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF@$DIGEST"
