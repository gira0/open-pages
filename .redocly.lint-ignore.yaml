# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# The OIDC login route answers a successful start with a redirect (302) to the identity
# provider, never a 2xx; its other answers are 400, 502 or 503.
api/openapi.yaml:
  operation-2xx-response:
    - '#/paths/~1v1~1auth~1oidc~1login/get/responses'
