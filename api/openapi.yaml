openapi: 3.1.0
info:
  title: open-pages API
  version: 0.0.0
  summary: Self-hosted static site hosting for internal networks.
  description: |
    The JSON API of open-pages. Who may do what is explained in `docs/auth.md`; the
    narrative guide with `curl` examples is `docs/api.md`.

    Conventions:

    - Request bodies are JSON unless stated otherwise and are limited to 64 KiB (uploads
      have their own limit).
    - Errors from the JSON routes are `{"error": "<message>"}`. A 500 always says
      `{"error": "internal error"}` (the `InternalError` response); the cause goes to the
      log, tagged with the request ID.
      Unknown paths and wrong methods (404, 405) are plain-text responses, not JSON.
    - Every response carries an `X-Request-Id` header generated by the server.
    - Every GET route also answers HEAD (Go's `net/http` does this implicitly); HEAD is not
      listed separately.
    - A request with an `Authorization: Bearer` header is judged on the token alone and
      never falls back to the session cookie. A rejected session cookie is cleared.
    - Cross-origin protection: any POST, PUT or DELETE sent by a browser from another origin
      (`Sec-Fetch-Site` other than `same-origin` or `none`, or an `Origin` that does not
      match `Host`) is answered `403 {"error": "cross-origin request rejected"}` before the
      route runs (the `CrossOrigin` response). Origins in `cors_origins` and the SAML ACS
      are exempt; requests without these headers (curl, CI, scripts sending a Bearer token) are not affected.
      Routes with a JSON body also answer `415` unless the request is `Content-Type:
      application/json`.
    - Some routes exist only when configured (marked "optional"): `/metrics` needs
      `[metrics] token`, register and login need `[auth] local_login`, the OIDC routes
      need `[oidc] enabled` and the SAML routes need `[saml] enabled`. An unregistered route answers like any unknown path.
    - Deployed sites are served outside this API, on their own hosts
      `<site>.<content_domain>/...` over GET and HEAD, never on the API host. A browser
      opens a non-public site through `GET /v1/auth/site-login`; the site host's own
      `GET /__open-pages/auth?code=...` (the path prefix `/__open-pages/` is reserved on site hosts)
      redeems the one-time code and sets the per-site cookie `site_session`
      (`__Host-site_session` with `cookie_secure`), `HttpOnly`, `SameSite=Lax`, valid 1 hour.
      It is not part of the API and is described in `docs/auth.md`. Every route
      in this document is served on `app_host` only; a request for any other host is a
      404, except `GET /healthz`, which answers on any host that is not a site host.
servers:
  - url: /
security:
  - cookieAuth: []
  - hostCookieAuth: []
  - bearerAuth: []
tags:
  - name: service
    description: Probes, metrics and the API description itself.
  - name: accounts
    description: Local accounts, sessions, and OIDC and SAML sign-in.
  - name: tokens
    description: API tokens. Session only; an API token cannot manage tokens.
  - name: groups
    description: Groups, their owners and members.
  - name: sites
    description: Sites, deploys and versions.

paths:
  /index:
    get:
      tags: [service]
      operationId: getIndex
      summary: HTML test page
      description: |
        A local login form (when local login is enabled), an OIDC and a SAML sign-in link (when those are
        enabled) and a form that creates a site and uploads an archive. It is a test page,
        not a stable interface.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string

  /static/{hash}/{path}:
    get:
      tags: [service]
      operationId: getStaticAsset
      summary: UI asset
      description: |
        A stylesheet, script, font or image embedded in the binary for the UI pages. Only
        the current build's hash is served, with `Cache-Control: public, max-age=31536000,
        immutable`; any other hash or unknown path is a plain-text 404 with
        `Cache-Control: no-store`. Assets are gzip-encoded when the client accepts it.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          description: The content hash of the current build, as the UI pages link it.
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: The asset path; it may contain slashes.
          schema:
            type: string
      responses:
        "200":
          description: The asset.
          content:
            "*/*":
              schema:
                type: string
        "404":
          description: Unknown hash or asset.
          content:
            text/plain:
              schema:
                type: string

  /v1/ping:
    get:
      tags: [service]
      operationId: ping
      summary: Liveness
      description: Always answers; it touches nothing.
      security: []
      responses:
        "200":
          description: Pong.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    const: pong

  /healthz:
    get:
      tags: [service]
      operationId: health
      summary: Health check
      description: |
        Pings the database and checks that the site and staging directories accept new
        files, giving up after 2 seconds. The response never says why a check failed; the
        reason is logged. Responses carry `Cache-Control: no-store`. Unlike the other routes
        it answers on any host that is not a site host, so probes by IP address work.
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /metrics:
    get:
      tags: [service]
      operationId: metrics
      summary: Prometheus metrics (optional)
      description: |
        Registered on the main listener only when `[metrics] token` is set. The bearer
        credential is that metrics token, not an API token. The dedicated metrics listener
        (`[metrics] listen`) serves this route too, and requires the token only when one is
        configured.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: "`metrics token required`, with `WWW-Authenticate: Bearer`."
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/openapi.yaml:
    get:
      tags: [service]
      operationId: getOpenAPI
      summary: This API description
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /v1/sites:
    get:
      tags: [sites]
      operationId: listPublicSites
      summary: List public sites
      description: |
        Sites whose visibility is `public`, ordered by name. `authenticated` and
        `restricted` sites never appear here.
      security: []
      responses:
        "200":
          description: The public sites.
          content:
            application/json:
              schema:
                type: object
                required: [sites]
                properties:
                  sites:
                    type: array
                    items:
                      type: object
                      required: [name, description]
                      properties:
                        name:
                          $ref: "#/components/schemas/SiteName"
                        description:
                          type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/user/register:
    post:
      tags: [accounts]
      operationId: register
      summary: Create a local account (optional)
      description: |
        Not registered when `[auth] local_login = false`. Registration is open: anyone who
        can reach the server can create an account.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          description: "`user already exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/user/login:
    post:
      tags: [accounts]
      operationId: login
      summary: Start a session (optional)
      description: |
        Not registered when `[auth] local_login = false`. Sets the `auth_cookie` session
        cookie, or `__Host-auth_cookie` with `cookie_secure = true` (`HttpOnly`,
        `SameSite=Lax`, `Path=/`, 7 days; `Secure` only with `cookie_secure = true`).
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`invalid email or password` (unknown email, wrong password, or an OIDC or SAML account)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/site-login:
    get:
      tags: [accounts]
      operationId: siteLogin
      summary: Sign in to a non-public site
      description: |
        Step two of the browser login for sites that are not public. A site host sends a
        browser here when it has no valid site cookie. If the browser has a session and may
        view the site, it is redirected to `<site>.<content_domain>/__open-pages/auth?code=...`
        (`https` with `cookie_secure`, the port of this request kept) with a one-time code
        (64 hex characters, valid 60 seconds, stored hashed, bound to the site, the user,
        `return` and `state`). Without a session it is redirected to
        `/index?next=<this request>` and the UI continues here after sign-in. Every response
        is `Cache-Control: no-store`; the redirect to the site also has
        `Referrer-Policy: no-referrer`.
      security: []
      parameters:
        - name: site
          in: query
          required: true
          description: A site name.
          schema:
            type: string
        - name: return
          in: query
          description: |
            Where to land on the site afterwards: a path starting with a single `/`, at
            most 2048 bytes, no backslash or control characters, not under `/__open-pages/`.
            Anything else becomes `/`.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The nonce (64 lowercase hex characters) the site host also put in its short-lived state cookie. Redeeming the code needs that cookie.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the site host with a code, or to `/index` to sign in first.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: "`invalid state`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Plain text. The site name is invalid or no such site exists, or the signed-in user
            may not view it; the three look the same.
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/oidc/login:
    get:
      tags: [accounts]
      operationId: oidcLogin
      summary: Start OIDC sign-in (optional)
      description: Registered only with `[oidc] enabled = true`.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            A path on this server to land on afterwards: starts with a single `/`, at most
            512 bytes, no backslash or line breaks.
          schema:
            type: string
      responses:
        "302":
          description: |
            Redirect to the identity provider. Sets the short-lived `oidc_state` cookie
            (`Path=/v1/auth/oidc`, 10 minutes); with `cookie_secure = true` it is
            `__Host-oidc_state` with `Path=/`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "400":
          description: "`return_to must be a path on this server`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          description: "`too many sign-in attempts, try again later`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/oidc/callback:
    get:
      tags: [accounts]
      operationId: oidcCallback
      summary: Finish OIDC sign-in (optional)
      description: |
        Registered only with `[oidc] enabled = true`. This is the redirect URI registered at
        the provider; it also needs the `oidc_state` (`__Host-oidc_state`) cookie set by the login route.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Sent by the provider when it refused the sign-in.
          schema:
            type: string
      responses:
        "200":
          description: Logged in (no `return_to` was given).
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "303":
          description: Logged in; redirect to the `return_to` given at login.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: "`unknown or expired login attempt`: state missing, not matching the cookie, already used, or older than 10 minutes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The provider refused the sign-in, or its ID token failed verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`the identity has no usable email address` or `email domain is not allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An account with this email already exists; it is not linked automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/saml/login:
    get:
      tags: [accounts]
      operationId: samlLogin
      summary: Start SAML sign-in (optional)
      description: Registered only with `[saml] enabled = true`.
      security: []
      parameters:
        - name: return_to
          in: query
          description: |
            A path on this server to land on afterwards: starts with a single `/`, at most
            512 bytes, no backslash or line breaks.
          schema:
            type: string
      responses:
        "302":
          description: |
            Redirect to the identity provider with an AuthnRequest (HTTP-Redirect binding).
            Sets the short-lived `saml_request` cookie (`Path=/v1/auth/saml`, 10 minutes,
            `SameSite=None; Secure` over https, `SameSite=Lax` over plain http). Over https the cookie
            is named `__Host-saml_request` with `Path=/`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "400":
          description: "`return_to must be a path on this server`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          description: "`too many sign-in attempts, try again later`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/saml/acs:
    post:
      tags: [accounts]
      operationId: samlAcs
      summary: Finish SAML sign-in (optional)
      description: |
        Registered only with `[saml] enabled = true`. The assertion consumer service: the
        browser posts the identity provider's response here (HTTP-POST binding). It also
        needs the `saml_request` cookie set by the login route; unsolicited and
        IdP-initiated responses are refused.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: The base64-encoded SAML Response, with a signed assertion or a signed response.
                RelayState:
                  type: string
                  description: Ignored.
      responses:
        "200":
          description: Logged in (no `return_to` was given).
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "303":
          description: Logged in; redirect to the `return_to` given at login.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          description: "`unknown or expired login attempt`: no cookie, a response that answers no pending request of this browser, already used, or older than 10 minutes. `SAMLResponse is required`: the form field is missing. `invalid form`: a malformed or oversized form body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The response failed verification (signature, issuer, audience, destination, recipient, validity period, replay, encryption, subject).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`the identity has no usable email address` or `email domain is not allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An account with this email already exists; it is not linked automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          description: "`too many sign-ins in progress, try again later`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/saml/metadata:
    get:
      tags: [accounts]
      operationId: samlMetadata
      summary: SAML service provider metadata (optional)
      description: |
        Registered only with `[saml] enabled = true`. The SP metadata to import at the
        identity provider; it does not depend on the provider being reachable.
      security: []
      responses:
        "200":
          description: The SAML 2.0 `EntityDescriptor`.
          content:
            application/samlmetadata+xml:
              schema:
                type: string

  /v1/auth/user:
    get:
      tags: [accounts]
      operationId: getCurrentUser
      summary: Current user, groups and sites
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [accounts]
      operationId: logout
      summary: End the session
      description: Deletes the session and clears the cookie.
      security:
        - cookieAuth: []
        - hostCookieAuth: []
      responses:
        "200":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Expires the session cookie (`auth_cookie` or `__Host-auth_cookie`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/tokens:
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token
      description: |
        The full token is returned only in this response; the server keeps a SHA-256 hash
        and the prefix. At most 50 unexpired tokens per user. The response has
        `Cache-Control: no-store`.
      security:
        - cookieAuth: []
        - hostCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  description: Required, at most 64 bytes (UTF-8).
                  type: string
                expires_in_days:
                  description: 0 or absent means the token never expires.
                  type: integer
                  minimum: 0
                  maximum: 3650
      responses:
        "201":
          description: The new token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          description: "`token limit reached; revoke one first`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List your API tokens
      description: The caller's tokens, ordered by id. Never contains the token itself.
      security:
        - cookieAuth: []
        - hostCookieAuth: []
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke an API token
      security:
        - cookieAuth: []
        - hostCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: "`token not found`, also for another user's token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: List your groups
      description: The groups the caller belongs to, ordered by name.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      description: The caller becomes owner and first member. Names are unique ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  description: 1 to 64 characters after trimming, no control characters.
                  type: string
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          description: "`a group with that name already exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [groups]
      operationId: getGroup
      summary: Group details and members
      description: Members only. Members are ordered by email.
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Delete a group
      description: Owner only; deletes the group and its memberships.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status:
                    type: string
                  id:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`group is still used by sites; move or delete them first`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/groups/{id}/members:
    post:
      tags: [groups]
      operationId: addGroupMember
      summary: Add a member
      description: |
        Owner only. The user must already have an account; the email match is exact,
        including case. Adding a provider-managed member by hand makes the membership manual.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Already a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdded"
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`group not found` or `user not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/groups/{id}/members/{uid}:
    delete:
      tags: [groups]
      operationId: removeGroupMember
      summary: Remove a member or leave
      description: The owner may remove any other member; a member may remove themselves.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: uid
          in: path
          required: true
          description: The user id, as listed in the group's `members`.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [status, group, user]
                properties:
                  status:
                    type: string
                  group:
                    type: integer
                    format: int64
                  user:
                    type: integer
                    format: int64
        "400":
          description: "`the owner can't be removed from the group; delete the group instead`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`group not found` or `user is not a member of this group`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sites:
    post:
      tags: [sites]
      operationId: createSite
      summary: Create a site
      description: |
        The caller owns the new site. Creating a site deploys nothing; until an archive is
        uploaded the site answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/SiteName"
                description:
                  description: At most 512 bytes (UTF-8).
                  type: string
                group:
                  description: Group id; 0 or absent for none. The owner must belong to the group.
                  type: integer
                  format: int64
                  minimum: 0
                visibility:
                  $ref: "#/components/schemas/Visibility"
      responses:
        "201":
          description: Site created.
          content:
            application/json:
              schema:
                type: object
                required: [status, name, visibility]
                properties:
                  status:
                    type: string
                  name:
                    $ref: "#/components/schemas/SiteName"
                  visibility:
                    $ref: "#/components/schemas/Visibility"
        "400":
          description: Invalid JSON, invalid or reserved name, description too long, bad visibility, or `group not found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`you are not a member of this group`, or `cross-origin request rejected`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`a site with that name already exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sites/{name}:
    parameters:
      - $ref: "#/components/parameters/SiteName"
    get:
      tags: [sites]
      operationId: getSite
      summary: Site metadata
      description: |
        For anyone who may view the site: any logged-in user for `public` and
        `authenticated` sites, the owner and the group's members for `restricted` ones.
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`you may not view this site`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [sites]
      operationId: updateSite
      summary: Update description, group or visibility
      description: Owner only. Absent fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: At most 512 bytes (UTF-8).
                  type: string
                group:
                  description: Group id; 0 removes the group.
                  type: integer
                  format: int64
                  minimum: 0
                visibility:
                  $ref: "#/components/schemas/Visibility"
      responses:
        "200":
          description: The updated fields.
          content:
            application/json:
              schema:
                type: object
                required: [name, description, group, visibility]
                properties:
                  name:
                    $ref: "#/components/schemas/SiteName"
                  description:
                    type: string
                  group:
                    description: 0 when the site has no group.
                    type: integer
                    format: int64
                  visibility:
                    $ref: "#/components/schemas/Visibility"
        "400":
          description: Invalid JSON, description too long, bad visibility, or `group not found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`you do not own this site`, `you are not a member of this group` or `cross-origin request rejected`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [sites]
      operationId: deleteSite
      summary: Delete a site
      description: Owner only. Removes all versions from disk, then the site.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status, name]
                properties:
                  status:
                    type: string
                  name:
                    $ref: "#/components/schemas/SiteName"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotSiteOwner"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sites/{name}/versions:
    get:
      tags: [sites]
      operationId: listSiteVersions
      summary: List kept versions
      description: Owner only. Versions kept on disk, newest first, and the live one.
      parameters:
        - $ref: "#/components/parameters/SiteName"
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [site, current, versions]
                properties:
                  site:
                    $ref: "#/components/schemas/SiteName"
                  current:
                    $ref: "#/components/schemas/CurrentVersion"
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotSiteOwner"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sites/{name}/rollback:
    post:
      tags: [sites]
      operationId: rollbackSite
      summary: Make a kept version live
      description: Owner only.
      parameters:
        - $ref: "#/components/parameters/SiteName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  $ref: "#/components/schemas/VersionID"
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployed"
        "400":
          description: "`body must be JSON with a version id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotSiteOwner"
        "404":
          description: "`site not found`, or `version not found` (not on disk, pruned, or not a valid id)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sites/{name}/upload:
    post:
      tags: [sites]
      operationId: uploadSite
      summary: Deploy an archive (raw body)
      description: |
        Owner only. The body is the archive itself: `.zip`, `.tar.gz` or `.tar`, detected
        from its first bytes, so `Content-Type` does not matter. It is extracted into a new
        version which becomes live atomically; versions beyond `keep_versions` are then
        deleted. Symlinks and other special entries are skipped.
      parameters:
        - $ref: "#/components/parameters/SiteName"
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Deployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployed"
        "400":
          $ref: "#/components/responses/BadArchive"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotSiteOwner"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "413":
          description: The upload exceeds `max_upload_mb`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            `max_concurrent_deploys` extractions are already running. `Retry-After` gives the
            seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/sites/{name}/formupload:
    post:
      tags: [sites]
      operationId: formUploadSite
      summary: Deploy an archive (multipart)
      description: |
        Same as `upload`, with the archive in the multipart field `file`. The whole request
        is capped at `max_upload_mb` plus 1 MiB; a missing field, a malformed body or a
        request over the cap is `400 missing or invalid file field`.
      parameters:
        - $ref: "#/components/parameters/SiteName"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "200":
          description: Deployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployed"
        "400":
          $ref: "#/components/responses/BadArchive"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotSiteOwner"
        "404":
          $ref: "#/components/responses/SiteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            `max_concurrent_deploys` extractions are already running. `Retry-After` gives the
            seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_cookie
      description: >-
        Session cookie from local login, OIDC or SAML sign-in, valid 7 days. Used when
        `cookie_secure = false`; with `cookie_secure = true` the cookie is `__Host-auth_cookie`
        (`hostCookieAuth`) and this one is ignored.
    hostCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-auth_cookie
      description: >-
        The session cookie when `cookie_secure = true`: `Secure`, `Path=/`, no `Domain`, so
        other hosts cannot set or shadow it. Otherwise as `cookieAuth`.
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token (`opt_...`) created with `POST /v1/auth/tokens`.
    metricsToken:
      type: http
      scheme: bearer
      description: The `[metrics] token` from the settings file.

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: A positive integer. Anything else is a 404 for that kind of object.
      schema:
        type: integer
        format: int64
        minimum: 1
    SiteName:
      name: name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SiteName"

  headers:
    SessionCookie:
      description: "`auth_cookie=...` session cookie (`__Host-auth_cookie=...` with `cookie_secure = true`)."
      schema:
        type: string

  requestBodies:
    Credentials:
      required: true
      description: |
        The email must be a bare address (no display name); the password must be 8 to 72
        bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Credentials"
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/Credentials"

  responses:
    InternalError:
      description: "`internal error`; the cause is logged with the request ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The body is not valid JSON or a field is invalid; the message says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "`unauthenticated`: no valid session cookie or API token."
      headers:
        Set-Cookie:
          description: Expires the session cookie (`auth_cookie` or `__Host-auth_cookie`), sent only when the request carried a rejected session cookie (not with a bearer token).
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionRequired:
      description: "`a login session is required`: API tokens are not accepted here."
      headers:
        Set-Cookie:
          description: Expires the session cookie (`auth_cookie` or `__Host-auth_cookie`), sent only when the request carried a rejected session cookie.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: >-
        `cross-origin request rejected`: a browser sent an unsafe request from another origin
        (`Sec-Fetch-Site` is not `same-origin` or `none`, or `Origin` does not match `Host`).
        Origins in `cors_origins` are exempt. Requests with neither header, such as curl and
        CI, are not affected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`Content-Type must be application/json`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The caller is not a member or not the owner, as the message says. On POST, PUT and
        DELETE it is also `cross-origin request rejected` (see `CrossOrigin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The object does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SiteNotFound:
      description: "`site not found`: unknown or invalid name."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSiteOwner:
      description: "`you do not own this site`, or `cross-origin request rejected`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadArchive:
      description: |
        Unsupported format, corrupt archive, an entry outside the site, too many entries
        (`max_extract_files`) or too large uncompressed (`max_extract_mb`), extraction
        taking longer than `deploy_timeout_seconds`, or the upload could not be read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: "`identity provider unavailable`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          enum: [ok, fail]
        checks:
          type: object
          required: [database, data_dir]
          properties:
            database:
              enum: [ok, fail]
            data_dir:
              enum: [ok, fail]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          description: 8 to 72 bytes (UTF-8); bcrypt ignores more.
          type: string
    UserInfo:
      type: object
      required: [userid, email, groups, docs]
      properties:
        userid:
          type: integer
          format: int64
        email:
          type: string
        groups:
          description: The groups the caller belongs to, by name.
          type: array
          items:
            $ref: "#/components/schemas/Group"
        docs:
          type: object
          required: [owned, viewable]
          properties:
            owned:
              description: The caller's own sites.
              type: array
              items:
                $ref: "#/components/schemas/SiteSummary"
            viewable:
              description: |
                Sites the caller owns, every `authenticated` site, and sites whose group the
                caller shares with the site owner. Public sites are listed by `GET /v1/sites`.
              type: array
              items:
                $ref: "#/components/schemas/SiteSummary"
    SiteSummary:
      type: object
      required: [id, name, description, owner_id, group_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/SiteName"
        description:
          type: string
        owner_id:
          type: [integer, "null"]
          format: int64
        group_id:
          type: [integer, "null"]
          format: int64
    Site:
      type: object
      required: [name, description, owner_id, group, visibility, current]
      properties:
        name:
          $ref: "#/components/schemas/SiteName"
        description:
          type: string
        owner_id:
          description: Null for a site without an owner.
          type: [integer, "null"]
          format: int64
        group:
          description: 0 when the site has no group.
          type: integer
          format: int64
        visibility:
          $ref: "#/components/schemas/Visibility"
        current:
          $ref: "#/components/schemas/CurrentVersion"
    SiteName:
      description: |
        A DNS label: 1 to 63 lowercase letters, digits or hyphens, not starting or ending
        with a hyphen. Reserved names (such as `api`, `www`, `admin`) are refused.
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    Visibility:
      description: Who may view the site. Defaults to `public` on create.
      enum: [public, authenticated, restricted]
    VersionID:
      description: A 20-character time-sortable id (xid).
      type: string
      pattern: "^[0-9a-v]{20}$"
    CurrentVersion:
      description: The live version, or `""` before the first deploy.
      type: string
      pattern: "^([0-9a-v]{20})?$"
    Deployed:
      type: object
      required: [status, site, version]
      properties:
        status:
          type: string
        site:
          $ref: "#/components/schemas/SiteName"
        version:
          $ref: "#/components/schemas/VersionID"
    Group:
      type: object
      required: [id, name, owner_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner_id:
          description: Null for groups that predate owners.
          type: [integer, "null"]
          format: int64
    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                type: object
                required: [id, email]
                properties:
                  id:
                    type: integer
                    format: int64
                  email:
                    type: string
    MemberAdded:
      type: object
      required: [status, group]
      properties:
        status:
          type: string
        group:
          type: integer
          format: int64
    Token:
      type: object
      required: [id, name, prefix, created, expires]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          description: The first characters of the token, for recognising it.
          type: string
        created:
          type: string
          format: date-time
        expires:
          description: Null for a token that never expires.
          type: [string, "null"]
          format: date-time
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              description: The full token. Returned only here.
              type: string
