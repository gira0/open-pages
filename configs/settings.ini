[paths]
# Where the database and the op_data site folder are created
datapath = .
# Where uploads are spooled before extraction
tmppath = .

[server]
# Interface to bind; empty means all interfaces
host =
http_port = 8080
# Set to true when served over HTTPS
cookie_secure = false
# Comma-separated origins allowed to call the API cross-origin; empty means same-origin only
cors_origins =

[limits]
max_upload_mb = 100
max_extract_mb = 500
max_extract_files = 10000

[sites]
# Versions kept on disk per site (including the live one); older ones are deleted on deploy
keep_versions = 5

# Hosted sites never share an origin with the API and UI (see docs/security-model.md).
# Host name of the API and UI, without scheme or port. Required.
# The values below suit local development: browsers and curl resolve *.localhost to the
# loopback address, so http://<site>.sites.localhost:8080/ works without DNS.
app_host = app.localhost
# Every site is served at https://<site>.<content_domain>/ (wildcard DNS and a wildcard
# certificate for *.<content_domain> are required). Required. In production use a
# separate registrable domain from app_host where you can (like github.com vs github.io),
# for example app_host = pages.corp and content_domain = pages-content.corp. It must not
# equal app_host, and app_host must not be <label>.<content_domain>.
content_domain = sites.localhost

[log]
# debug, info, warn or error
level = info
# text (key=value lines) or json (one object per line, for log shippers)
format = text

[metrics]
# Prometheus metrics at /metrics are off unless one of these is set.
# Serve them on a separate address that only your monitoring network can reach, for
# example 127.0.0.1:9100 (the listener serves nothing but /metrics):
listen =
# And/or expose /metrics on the main listener, readable only with
# "Authorization: Bearer <token>" (at least 16 characters; keep this file private):
token =

[auth]
# Serve POST /v1/user/register and /v1/user/login. Set to false for SSO-only setups
# (needs [oidc] or [saml] enabled = true).
local_login = true

[oidc]
# OpenID Connect sign-in (Keycloak, Entra ID, ADFS, ...). Off unless enabled = true.
# Adds GET /v1/auth/oidc/login and GET /v1/auth/oidc/callback; see docs/auth.md.
enabled = false
# Issuer URL exactly as the provider reports it (discovery is fetched from
# <issuer>/.well-known/openid-configuration). Must be https.
# Keycloak: https://sso.example.com/realms/corp
# Entra ID: https://login.microsoftonline.com/<tenant-id>/v2.0
#issuer = https://sso.example.com/realms/corp
#client_id = open-pages
# The client secret lives only in this file: make it readable only by the service user.
#client_secret =
# The callback URL as registered at the provider (this server's public address).
#redirect_url = https://pages.example.com/v1/auth/oidc/callback
# "openid" is always requested.
#scopes = openid email profile
# Claim holding the email address (required: it becomes the account's email).
#email_claim = email
# Claim holding group names; open-pages groups with the same name (ignoring case) are joined
# at each login. Unknown names are ignored; groups are never created. Empty turns mapping off.
#groups_claim = groups
# Only let people with an email in this domain sign in; empty allows any.
#allowed_email_domain = corp.example

[saml]
# SAML 2.0 sign-in (Keycloak, Entra ID, ADFS, Okta, ...). Off unless enabled = true. SP-initiated
# only. Adds GET /v1/auth/saml/login, POST /v1/auth/saml/acs and GET /v1/auth/saml/metadata;
# see docs/auth.md. The Response or the assertion must be signed by a certificate in the IdP
# metadata.
enabled = false
# The IdP's metadata: an https URL (fetched on first use and refreshed hourly) or a file.
# Set exactly one of the two.
#idp_metadata_url = https://sso.example.com/realms/corp/protocol/saml/descriptor
#idp_metadata_file = /etc/open-pages/idp-metadata.xml
# This service's entity ID, as registered at the IdP (assertions must name it as audience).
#entity_id = https://pages.example.com/v1/auth/saml/metadata
# The assertion consumer service URL as registered at the IdP (this server's public address).
#acs_url = https://pages.example.com/v1/auth/saml/acs
# Attribute holding the email address (required: it becomes the account's email). An
# email-format NameID is used when the attribute is missing.
#email_attribute = email
# Attribute holding group names; open-pages groups with the same name (ignoring case) are
# joined at each login. Unknown names are ignored; groups are never created. Empty turns
# mapping off.
#groups_attribute = groups
# Identify users by this attribute instead of the NameID (which must then be left unused).
#nameid_attribute =
# Only let people with an email in this domain sign in; empty allows any.
#allowed_email_domain = corp.example
# Optional: sign AuthnRequests with this key and certificate (PEM, RSA only). The
# certificate is published in the SP metadata. Make the key readable only by the service user.
#key_file = /etc/open-pages/saml.key
#cert_file = /etc/open-pages/saml.crt
