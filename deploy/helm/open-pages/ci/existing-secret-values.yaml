# Secrets from an existing Secret, existing claim, no staging volume.
config:
  appHost: pages.example.com
  contentDomain: pages-content.example.com
  oidc:
    enabled: true
    issuer: https://sso.example.com/realms/corp
    clientId: open-pages
    redirectUrl: https://pages.example.com/v1/auth/oidc/callback
secrets:
  existingSecret: open-pages-secrets
persistence:
  existingClaim: my-claim
stagingVolume:
  enabled: false
