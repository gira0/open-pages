{{- /* Every value is validated in the Deployment; the ini file is built from values only. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-pages.fullname" . }}
  labels:
    {{- include "open-pages.labels" . | nindent 4 }}
data:
  settings.ini: |
    # Generated by the open-pages Helm chart. Change the chart values, not this file.
    [paths]
    datapath = /data
    tmppath = {{ if .Values.stagingVolume.enabled }}{{ include "open-pages.stagingPath" . }}{{ else }}/data{{ end }}

    [server]
    host =
    http_port = {{ .Values.config.httpPort }}
    cookie_secure = {{ .Values.config.cookieSecure }}
    cors_origins = {{ join "," .Values.config.corsOrigins }}
    trusted_proxies = {{ join "," .Values.config.trustedProxies }}
    shutdown_timeout = {{ .Values.config.shutdownTimeout }}
    drain_delay = {{ .Values.config.drainDelay }}

    [limits]
    max_upload_mb = {{ .Values.config.limits.maxUploadMb }}
    max_extract_mb = {{ .Values.config.limits.maxExtractMb }}
    max_extract_files = {{ .Values.config.limits.maxExtractFiles }}
    max_concurrent_deploys = {{ .Values.config.limits.maxConcurrentDeploys }}
    deploy_timeout_seconds = {{ .Values.config.limits.deployTimeoutSeconds }}

    [sites]
    keep_versions = {{ .Values.config.sites.keepVersions }}
    app_host = {{ include "open-pages.appHost" . }}
    content_domain = {{ include "open-pages.contentDomain" . }}

    [auth]
    local_login = {{ .Values.config.auth.localLogin }}

    [audit]
    retention_days = {{ .Values.config.audit.retentionDays }}

    [quotas]
    site_mb = {{ .Values.config.quotas.siteMb }}
    user_mb = {{ .Values.config.quotas.userMb }}
    sites_per_user = {{ .Values.config.quotas.sitesPerUser }}

    [log]
    level = {{ .Values.config.log.level }}
    format = {{ .Values.config.log.format }}

    [metrics]
    listen = {{ .Values.config.metrics.listen }}
    {{- /* token and client_secret are never written here; see the *_FILE variables. */}}

    [oidc]
    enabled = {{ .Values.config.oidc.enabled }}
    {{- with .Values.config.oidc }}
    {{- if .enabled }}
    issuer = {{ .issuer }}
    client_id = {{ .clientId }}
    redirect_url = {{ .redirectUrl }}
    {{- with .scopes }}
    scopes = {{ . }}
    {{- end }}
    {{- with .emailClaim }}
    email_claim = {{ . }}
    {{- end }}
    {{- with .groupsClaim }}
    groups_claim = {{ . }}
    {{- end }}
    {{- with .allowedEmailDomain }}
    allowed_email_domain = {{ . }}
    {{- end }}
    {{- end }}
    {{- end }}

    [saml]
    enabled = {{ .Values.config.saml.enabled }}
    {{- with .Values.config.saml }}
    {{- if .enabled }}
    idp_metadata_url = {{ .idpMetadataUrl }}
    entity_id = {{ .entityId }}
    acs_url = {{ .acsUrl }}
    {{- with .emailAttribute }}
    email_attribute = {{ . }}
    {{- end }}
    {{- with .groupsAttribute }}
    groups_attribute = {{ . }}
    {{- end }}
    {{- with .nameidAttribute }}
    nameid_attribute = {{ . }}
    {{- end }}
    {{- with .allowedEmailDomain }}
    allowed_email_domain = {{ . }}
    {{- end }}
    {{- end }}
    {{- end }}
