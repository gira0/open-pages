{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "open-pages.fullname" . }}
  labels:
    {{- include "open-pages.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "open-pages.appHost" . | quote }}
    - {{ printf "*.%s" (include "open-pages.contentDomain" .) | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "open-pages.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
