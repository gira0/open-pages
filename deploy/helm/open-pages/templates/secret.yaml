{{- if include "open-pages.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-pages.secretName" . }}
  labels:
    {{- include "open-pages.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.oidcClientSecret }}
  {{ $.Values.secrets.keys.oidcClientSecret }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  {{ $.Values.secrets.keys.metricsToken }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.samlKey }}
  {{ $.Values.secrets.keys.samlKey }}: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.secrets.samlCert }}
  {{ $.Values.secrets.keys.samlCert }}: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
