apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-pages.fullname" . }}
  labels:
    {{- include "open-pages.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "open-pages.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.config.metrics.listen }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-pages.fullname" . }}-metrics
  labels:
    {{- include "open-pages.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "open-pages.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ include "open-pages.metricsPort" . }}
      targetPort: metrics
      protocol: TCP
{{- end }}
