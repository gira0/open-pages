# Default settings baked into the container image. Mount your own file at
# /etc/open-pages/settings.ini to override; see the repository's settings.ini
# for every option. Keep datapath and tmppath under /data, the image's volume.
app_mode = production

[paths]
datapath = /data
tmppath = /data

[server]
# Empty means all interfaces, which a container needs to be reachable.
host =
http_port = 8080
# Set to true when served over HTTPS
cookie_secure = false
cors_origins =

[limits]
max_upload_mb = 100
max_extract_mb = 500
max_extract_files = 10000

[sites]
keep_versions = 5
url_mode = path
base_domain =
