# Example deployment. `docker compose up --build` builds locally; to use a released
# image instead, replace `build: .` with image: ghcr.io/gira0/open-pages:<version>.
services:
  open-pages:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Database and deployed sites. A named volume is writable by the image's
      # non-root user (uid 65532); a bind mount must be chowned to that uid first.
      - open-pages-data:/data
      # Optional: override the defaults baked into the image (see deploy/settings.ini).
      # - ./settings.ini:/etc/open-pages/settings.ini:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  open-pages-data:
