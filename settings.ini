# possible values : production, development
app_mode = development

[paths]
# Where the database and the op_data site folder are created
datapath = .
# Where uploads are spooled before extraction
tmppath = .

[server]
# Interface to bind; empty means all interfaces
host =
http_port = 8080
# Set to true when served over HTTPS
cookie_secure = false
# Comma-separated origins allowed to call the API cross-origin; empty means same-origin only
cors_origins =

[limits]
max_upload_mb = 100
max_extract_mb = 500
max_extract_files = 10000

[sites]
# Versions kept on disk per site (including the live one); older ones are deleted on deploy
keep_versions = 5

# How a request names its site:
#   path       <base_domain>/<site>/...   one DNS name and certificate; sites share an origin
#   subdomain  <site>.<base_domain>/...   needs wildcard DNS and a wildcard certificate;
#              each site gets its own origin
url_mode = path
# Host name of the API and UI, without a port (for example pages.corp); required for subdomain mode
base_domain =

[log]
# debug, info, warn or error
level = info
# text (key=value lines) or json (one object per line, for log shippers)
format = text

[metrics]
# Prometheus metrics at /metrics are off unless one of these is set.
# Serve them on a separate address that only your monitoring network can reach, for
# example 127.0.0.1:9100 (the listener serves nothing but /metrics):
listen =
# And/or expose /metrics on the main listener, readable only with
# "Authorization: Bearer <token>" (at least 16 characters; keep this file private):
token =

[auth]
# Serve POST /v1/user/register and /v1/user/login. Set to false for OIDC-only setups
# (needs [oidc] enabled = true).
local_login = true

[oidc]
# OpenID Connect sign-in (Keycloak, Entra ID, ADFS, ...). Off unless enabled = true.
# Adds GET /v1/auth/oidc/login and GET /v1/auth/oidc/callback; see the README.
enabled = false
# Issuer URL exactly as the provider reports it (discovery is fetched from
# <issuer>/.well-known/openid-configuration). Must be https.
# Keycloak: https://sso.example.com/realms/corp
# Entra ID: https://login.microsoftonline.com/<tenant-id>/v2.0
#issuer = https://sso.example.com/realms/corp
#client_id = open-pages
# Prefer the OPEN_PAGES_OIDC_CLIENT_SECRET environment variable over writing the secret here;
# if set, it wins. Keep this file private if the secret is in it.
#client_secret =
# The callback URL as registered at the provider (this server's public address).
#redirect_url = https://pages.example.com/v1/auth/oidc/callback
# "openid" is always requested.
#scopes = openid email profile
# Claim holding the email address (required: it becomes the account's email).
#email_claim = email
# Claim holding group names; open-pages groups with the same name (ignoring case) are joined
# at each login. Unknown names are ignored; groups are never created. Empty turns mapping off.
#groups_claim = groups
# Only let people with an email in this domain sign in; empty allows any.
#allowed_email_domain = corp.example
