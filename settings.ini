# possible values : production, development
app_mode = development

[paths]
# Where the database and the op_data site folder are created
datapath = .
# Where uploads are spooled before extraction
tmppath = .

[server]
# Interface to bind; empty means all interfaces
host =
http_port = 8080
# Set to true when served over HTTPS
cookie_secure = false
# Comma-separated origins allowed to call the API cross-origin; empty means same-origin only
cors_origins =

[limits]
max_upload_mb = 100
max_extract_mb = 500
max_extract_files = 10000

[sites]
# Versions kept on disk per site (including the live one); older ones are deleted on deploy
keep_versions = 5

# How a request names its site:
#   path       <base_domain>/<site>/...   one DNS name and certificate; sites share an origin
url_mode = path
# Host name of the API and UI, without a port (for example pages.corp)
base_domain =
