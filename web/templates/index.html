{{template "layout" .}}

{{define "content"}}
<section class="pf-v6-c-page__main-section">
	<div class="pf-v6-c-page__main-body">
		<h1 class="pf-v6-c-title pf-m-2xl">{{.title}}</h1>
	</div>
</section>
{{if or .oidc .localLogin}}
<section class="pf-v6-c-page__main-section">
	<div class="pf-v6-c-page__main-body">
		<h2 class="pf-v6-c-title pf-m-lg">Sign in</h2>
		{{if .oidc}}
		<p><a class="pf-v6-c-button pf-m-secondary" href="/v1/auth/oidc/login"><span class="pf-v6-c-button__text">Sign in with your company account</span></a></p>
		{{end}}
		{{if .localLogin}}
		<form class="pf-v6-c-form op-narrow" action="/v1/user/login" method="post">
			<div class="pf-v6-c-form__group">
				<div class="pf-v6-c-form__group-label">
					<label class="pf-v6-c-form__label" for="email"><span class="pf-v6-c-form__label-text">Email</span></label>
				</div>
				<div class="pf-v6-c-form__group-control">
					<span class="pf-v6-c-form-control"><input type="email" id="email" name="email" autocomplete="username" required></span>
				</div>
			</div>
			<div class="pf-v6-c-form__group">
				<div class="pf-v6-c-form__group-label">
					<label class="pf-v6-c-form__label" for="password"><span class="pf-v6-c-form__label-text">Password</span></label>
				</div>
				<div class="pf-v6-c-form__group-control">
					<span class="pf-v6-c-form-control"><input type="password" id="password" name="password" autocomplete="current-password" required></span>
				</div>
			</div>
			<div class="pf-v6-c-form__group pf-m-action">
				<div class="pf-v6-c-form__actions">
					<button class="pf-v6-c-button pf-m-primary" type="submit"><span class="pf-v6-c-button__text">Sign in</span></button>
				</div>
			</div>
		</form>
		{{end}}
	</div>
</section>
{{end}}
<section class="pf-v6-c-page__main-section">
	<div class="pf-v6-c-page__main-body">
		<h2 class="pf-v6-c-title pf-m-lg">Upload a site</h2>
		<form class="pf-v6-c-form op-narrow" id="upload-form">
			<div class="pf-v6-c-form__group">
				<div class="pf-v6-c-form__group-label">
					<label class="pf-v6-c-form__label" for="name"><span class="pf-v6-c-form__label-text">Site name</span></label>
				</div>
				<div class="pf-v6-c-form__group-control">
					<span class="pf-v6-c-form-control"><input type="text" id="name" name="name" required></span>
				</div>
			</div>
			<div class="pf-v6-c-form__group">
				<div class="pf-v6-c-form__group-label">
					<label class="pf-v6-c-form__label" for="file"><span class="pf-v6-c-form__label-text">Archive (.zip or .tar.gz)</span></label>
				</div>
				<div class="pf-v6-c-form__group-control">
					<input type="file" id="file" name="file" accept=".zip,.tar.gz" required>
				</div>
			</div>
			<div class="pf-v6-c-form__group pf-m-action">
				<div class="pf-v6-c-form__actions">
					<button class="pf-v6-c-button pf-m-primary" type="submit"><span class="pf-v6-c-button__text">Upload</span></button>
				</div>
			</div>
			<progress id="upload-progress" value="0" max="100" aria-label="Upload progress"></progress>
			<pre id="upload-result" role="status" aria-live="polite"></pre>
		</form>
	</div>
</section>
{{end}}
