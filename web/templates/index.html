<html>
	<head>
	</head>
	<h1>
		{{ .title }}
	</h1>
	{{ if .oidc }}
	<p><a href="/v1/auth/oidc/login">Sign in with your company account</a></p>
	{{ end }}
	{{ if .localLogin }}
	<form action="/v1/user/login" method="post">
		<label for="email">email:</label>
		<input type="text" id="email" name="email"><br><br>
		<label for="password">password:</label>
		<input type="password" id="password" name="password"><br><br>
		<input type="submit" value="Submit">
	  </form>
	{{ end }}

	  <br><br>
	  <form id='form'>
		<label for="name">site name:</label>
		<input type="text" id="name" name="name" required><br><br>
        <input type='file' name='file' accept=".zip,.tar.gz" required>
        <button>
            Upload
        </button>
        <progress id='progress' value='0' max='100'></progress>
        <pre id='result'></pre>
    </form>
    <script>
        // Creates the site (an existing one is fine) and then uploads the archive to it.
        document.getElementById('form').addEventListener('submit', async function (evt) {
          evt.preventDefault();
          const result = document.getElementById('result');
          const progress = document.getElementById('progress');
          const name = this.elements['name'].value;
          const file = this.elements['file'].files[0];
          progress.value = 0;
          result.textContent = '';
          const created = await fetch('/v1/auth/sites', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
          });
          if (!created.ok && created.status !== 409) {
            result.textContent = 'create site failed: ' + await created.text();
            return;
          }
          const data = new FormData();
          data.append('file', file);
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/v1/auth/sites/' + encodeURIComponent(name) + '/formupload');
          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) { progress.value = e.loaded / e.total * 100; }
          };
          xhr.onload = function () { result.textContent = xhr.status + ' ' + xhr.responseText; };
          xhr.onerror = function () { result.textContent = 'upload failed'; };
          xhr.send(data);
        });
    </script>
</html>
